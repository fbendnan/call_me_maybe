[project]
name = "call-me-maybee"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub>=1.12.0",
    "mypy>=2.3.0",
    "pydantic>=2.13.3",
    "torch>=2.11.0",
    "transformers>=5.6.2",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
default = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
